# GitHub-safe example configuration.
# Spatial feature extraction. Run commands from the repository root.
# Copy to a *.local.yaml file before changing input/output locations.
# Relative paths resolve against the process working directory.
input_root: Visium_samples/visium_cohort_clean
output_root: local/spatial_features
sample_glob: SAMPLE_*

# Select stages with run_pipeline.py --start 01 --end 10.
# Scientific parameters are declared in individual stage CLIs/constants;
# unused YAML keys do not override them.
# New samples: extract through Step 09, then apply saved development
# transformations at inference. Do not fit Step 10 on external samples.

