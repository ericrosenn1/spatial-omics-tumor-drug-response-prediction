name: Workflow tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-reviewer.txt
            constraints-reviewer.txt
            prediction_modeling_pipeline/spatial_prediction_model_V2/requirements-v2-reproducible.txt
      - name: Install declared spatial environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Spatial environment creation failed: $LASTEXITCODE" }
          & .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Spatial installation failed: $LASTEXITCODE" }
          & .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Spatial dependency check failed: $LASTEXITCODE" }
      - name: Install pinned V2 environment
        run: |
          python -m venv .venv_v2
          if ($LASTEXITCODE -ne 0) { throw "V2 environment creation failed: $LASTEXITCODE" }
          & .\.venv_v2\Scripts\python.exe -m pip install -r prediction_modeling_pipeline/spatial_prediction_model_V2/requirements-v2-reproducible.txt
          if ($LASTEXITCODE -ne 0) { throw "V2 installation failed: $LASTEXITCODE" }
          & .\.venv_v2\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "V2 dependency check failed: $LASTEXITCODE" }
      - name: Install coverage tooling
        run: |
          & .\.venv\Scripts\python.exe -m pip install -r requirements-coverage.txt
          if ($LASTEXITCODE -ne 0) { throw "Spatial coverage installation failed: $LASTEXITCODE" }
          & .\.venv_v2\Scripts\python.exe -m pip install -r requirements-coverage.txt
          if ($LASTEXITCODE -ne 0) { throw "V2 coverage installation failed: $LASTEXITCODE" }
      - name: Run spatial and teacher regressions
        run: |
          $env:COVERAGE_FILE = ".coverage.spatial"
          & .\.venv\Scripts\python.exe -m pytest tests spatial_feature_identification_pipeline/tests prediction_modeling_pipeline/teacher_builder/tests --cov=. --cov-report= -q
          if ($LASTEXITCODE -ne 0) { throw "Spatial and teacher tests failed: $LASTEXITCODE" }
      - name: Run V2, interpretation and transfer regressions
        run: |
          $env:COVERAGE_FILE = ".coverage.v2"
          & .\.venv_v2\Scripts\python.exe -m pytest prediction_modeling_pipeline/spatial_prediction_model_V2/tests prediction_modeling_pipeline/prediction_interpretation_model/tests prediction_modeling_pipeline/spatial_transfer_inference_model/tests --cov=. --cov-report= -q
          if ($LASTEXITCODE -ne 0) { throw "V2 and downstream tests failed: $LASTEXITCODE" }
      - name: Build combined coverage report
        run: |
          Remove-Item Env:COVERAGE_FILE -ErrorAction SilentlyContinue
          & .\.venv\Scripts\python.exe -m coverage combine
          if ($LASTEXITCODE -ne 0) { throw "Coverage data merge failed: $LASTEXITCODE" }
          & .\.venv\Scripts\python.exe -m coverage xml -o coverage.xml
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath coverage.xml)) { throw "coverage.xml generation failed" }
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          use_oidc: true
          verbose: true
      - name: Execute documented seeded smoke and public handoff
        run: |
          & .\.venv\Scripts\python.exe scripts/run_smoke.py --output local/smoke
          if ($LASTEXITCODE -ne 0) { throw "Workflow smoke failed: $LASTEXITCODE" }
          & .\.venv_v2\Scripts\python.exe prediction_modeling_pipeline/spatial_prediction_model_V2/scripts/16_prepare_precomputed_teacher.py --manifest prediction_modeling_pipeline/teacher_builder/precomputed_handoff_manifest.json --output local/precomputed_handoff
          if ($LASTEXITCODE -ne 0) { throw "Public handoff failed: $LASTEXITCODE" }
      - name: Check portable source and documentation links
        run: |
          & .\.venv\Scripts\python.exe scripts/audit_public_repository.py --output local/source_audit.json
          if ($LASTEXITCODE -ne 0) { throw "Source audit failed: $LASTEXITCODE" }
